<meta charset="utf-8">
<title>Dajia Talks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Karla:wght@400;500;600;700;800&family=Spline+Sans+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ground:#F4F1E8;
    --surface:#FCFBF5;
    --surface-2:#EDE9DB;
    --ink:#242B24;
    --ink-soft:#5E6960;
    --ink-faint:#8E978D;
    --accent:#35664A;
    --accent-deep:#2A5540;
    --accent-ink:#F6F7EF;
    --accent-soft:#DBE7DE;
    --warm:#B97C20;
    --warm-soft:#F3E5C5;
    --seal:#AF4030;
    --seal-ink:#F8ECDD;
    --line:#DBD5C2;
    --line-soft:#E8E3D2;
    --glow:rgba(205,146,52,.13);
    --av-s:45%; --av-l:82%; --av-cs:50%; --av-cl:27%;
    --shadow:0 1px 2px rgba(36,43,37,.05), 0 16px 36px -20px rgba(36,43,37,.28);
    --shadow-pop:0 8px 22px -8px rgba(36,43,37,.3);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#131A15;
      --surface:#1C241E;
      --surface-2:#232C25;
      --ink:#EAE7DA;
      --ink-soft:#9CA89D;
      --ink-faint:#6F7B71;
      --accent:#8FC0A0;
      --accent-deep:#A5CFB3;
      --accent-ink:#122619;
      --accent-soft:#2A3B30;
      --warm:#E0A65A;
      --warm-soft:#3A3222;
      --seal:#C05B44;
      --seal-ink:#F8ECDD;
      --line:#303A32;
      --line-soft:#283129;
      --glow:rgba(224,166,90,.08);
      --av-s:26%; --av-l:28%; --av-cs:38%; --av-cl:80%;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 16px 36px -20px rgba(0,0,0,.55);
      --shadow-pop:0 8px 22px -8px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --ground:#131A15;
    --surface:#1C241E;
    --surface-2:#232C25;
    --ink:#EAE7DA;
    --ink-soft:#9CA89D;
    --ink-faint:#6F7B71;
    --accent:#8FC0A0;
    --accent-deep:#A5CFB3;
    --accent-ink:#122619;
    --accent-soft:#2A3B30;
    --warm:#E0A65A;
    --warm-soft:#3A3222;
    --seal:#C05B44;
    --seal-ink:#F8ECDD;
    --line:#303A32;
    --line-soft:#283129;
    --glow:rgba(224,166,90,.08);
    --av-s:26%; --av-l:28%; --av-cs:38%; --av-cl:80%;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 16px 36px -20px rgba(0,0,0,.55);
    --shadow-pop:0 8px 22px -8px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background-color:var(--ground);
    background-image:radial-gradient(900px 460px at 50% -140px, var(--glow), transparent 70%);
    background-repeat:no-repeat;
    color:var(--ink);
    font-family:'Karla',system-ui,-apple-system,sans-serif;
    font-size:16px;line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'Spline Sans Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
  .wrap{max-width:680px;margin:0 auto;padding:22px 20px 110px}
  a{color:var(--accent)}
  button{font:inherit;color:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}}
  @keyframes grow{from{width:0}}
  @keyframes press{from{opacity:0;transform:scale(.85) rotate(-14deg)}}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none !important;transition:none !important}
  }

  /* ---------- header ---------- */
  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px}
  .wordmark{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:24px;letter-spacing:.005em}
  .wordmark .dot{color:var(--warm)}
  .wordmark .cjk{font-size:11px;color:var(--ink-faint);margin-left:9px;letter-spacing:.4em;font-weight:400;font-family:system-ui,sans-serif}
  .famname{font-size:13px;color:var(--ink-soft);text-align:right}
  nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:12px 0 0}
  nav.tabs button{
    background:none;border:none;padding:9px 13px 11px;font-size:13.5px;font-weight:700;
    letter-spacing:.02em;color:var(--ink-soft);border-bottom:2px solid transparent;margin-bottom:-1px;
    transition:color .15s;
  }
  nav.tabs button:hover{color:var(--ink)}
  nav.tabs button.on{color:var(--ink);border-bottom-color:var(--warm)}
  .clockline{font-size:11.5px;color:var(--ink-faint);margin:16px 2px 0;letter-spacing:.03em;text-align:center}

  /* ---------- question hero ---------- */
  .eyebrow{
    display:flex;gap:12px;align-items:center;justify-content:center;
    max-width:440px;margin:36px auto 18px;
    font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);
    animation:rise .55s cubic-bezier(.2,.7,.2,1) both;
  }
  .eyebrow::before,.eyebrow::after{content:"";flex:1;height:1px}
  .eyebrow::before{background:linear-gradient(90deg,transparent,var(--line))}
  .eyebrow::after{background:linear-gradient(90deg,var(--line),transparent)}
  .eyebrow .tag{color:var(--warm);font-weight:500;white-space:nowrap}
  .eyebrow .sep{color:var(--line)}
  h1.q{
    font-family:'Fraunces',Georgia,serif;font-optical-sizing:auto;font-weight:500;
    font-size:clamp(30px,6vw,44px);line-height:1.14;text-align:center;
    margin:0 auto;max-width:580px;text-wrap:balance;letter-spacing:-.012em;
    animation:rise .55s cubic-bezier(.2,.7,.2,1) .07s both;
  }
  .sprig{text-align:center;color:var(--warm);margin:16px 0 10px;animation:rise .55s cubic-bezier(.2,.7,.2,1) .14s both}
  .qsub{text-align:center;color:var(--ink-soft);font-size:14px;margin:0 auto 30px;max-width:52ch;animation:rise .55s cubic-bezier(.2,.7,.2,1) .18s both}
  .reroll{text-align:center;margin:-20px 0 26px;animation:rise .55s cubic-bezier(.2,.7,.2,1) .22s both}
  .reroll .linkbtn{font-size:12.5px;color:var(--ink-soft);text-decoration-color:var(--line)}
  .reroll .linkbtn:hover{color:var(--accent)}

  /* ---------- cards & composer ---------- */
  .card{background:var(--surface);border:1px solid var(--line-soft);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow)}
  .card + .card{margin-top:14px}
  .stack > * + *{margin-top:14px}
  .composer textarea{
    width:100%;min-height:120px;resize:vertical;border:1px solid var(--line);border-radius:12px;
    background:var(--ground);color:var(--ink);padding:13px 15px;font:inherit;line-height:1.55;
    transition:border-color .15s, box-shadow .15s;
  }
  .composer textarea::placeholder{color:var(--ink-faint)}
  .composer textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .polloptions{display:flex;flex-direction:column;gap:10px}
  .polloptions button.opt{
    text-align:left;border:1.5px solid var(--line);border-radius:13px;background:var(--surface);
    padding:14px 17px;font-size:16px;font-weight:600;display:flex;align-items:center;gap:13px;
    transition:border-color .15s, background .15s, transform .15s;
  }
  .polloptions button.opt:hover{border-color:var(--accent);transform:translateX(2px)}
  .polloptions button.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
  .polloptions .radio{width:17px;height:17px;border-radius:50%;border:2px solid var(--ink-faint);flex:none;transition:all .15s}
  .polloptions .sel .radio{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 3.5px var(--surface)}
  .btnrow{display:flex;gap:12px;align-items:center;margin-top:16px;flex-wrap:wrap}
  .btn{
    border:none;border-radius:999px;padding:11px 22px;font-weight:700;font-size:15px;
    letter-spacing:.01em;background:var(--accent);color:var(--accent-ink);
    box-shadow:0 1px 2px rgba(0,0,0,.12);
    transition:background .15s, transform .15s, box-shadow .15s;
  }
  .btn:hover:not(:disabled){background:var(--accent-deep);transform:translateY(-1px);box-shadow:var(--shadow-pop)}
  .btn:active:not(:disabled){transform:translateY(0);box-shadow:0 1px 2px rgba(0,0,0,.12)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink);font-weight:600;box-shadow:none}
  .btn.ghost:hover:not(:disabled){background:var(--surface-2);border-color:var(--ink-faint)}
  .btn.small{padding:7px 15px;font-size:13px}
  .linkbtn{background:none;border:none;padding:0;color:var(--accent);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}
  .hint{font-size:13px;color:var(--ink-soft)}

  /* ---------- section labels ---------- */
  .presence h3, .sectionhead{
    font-family:'Spline Sans Mono',ui-monospace,monospace;
    font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);
    font-weight:500;margin:0 0 12px;
  }

  /* ---------- people ---------- */
  .grouprow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:6px 0}
  .gname{font-weight:700;font-size:12px;color:var(--ink-faint);min-width:80px}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{
    display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;
    border-radius:999px;padding:3px 12px 3px 4px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink-soft);
  }
  .chip .av, .who .av, .whoami .grid button .av{
    width:23px;height:23px;border-radius:50%;flex:none;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:800;font-family:'Karla',sans-serif;
    background:hsl(var(--avh,140) var(--av-s) var(--av-l));
    color:hsl(var(--avh,140) var(--av-cs) var(--av-cl));
  }
  .chip.done{border-color:transparent;background:var(--accent-soft);color:var(--ink)}
  .chip.done .av{background:var(--accent);color:var(--accent-ink)}
  .chip.me{box-shadow:0 0 0 1.5px var(--warm)}
  a.chip{text-decoration:none;padding:6px 16px;font-size:14px;transition:border-color .15s, transform .15s}
  a.chip:hover{border-color:var(--accent);transform:translateY(-1px)}

  /* ---------- lock / seal ---------- */
  .lock{text-align:center;padding:30px 22px;margin-top:16px}
  .lock .big{font-family:'Fraunces',Georgia,serif;font-size:21px;font-weight:500;margin:6px 0 5px;text-wrap:balance}
  .lock .count{color:var(--warm);font-weight:500}
  .seal{
    width:58px;height:58px;margin:2px auto 16px;border-radius:15px;
    display:flex;align-items:center;justify-content:center;
    background:var(--seal);color:var(--seal-ink);
    font-size:27px;font-weight:600;font-family:Georgia,'Fraunces',serif;
    box-shadow:inset 0 0 0 2px var(--seal), inset 0 0 0 4px var(--seal-ink), 0 3px 12px -3px rgba(0,0,0,.35);
    transform:rotate(-5deg);
    animation:press .5s cubic-bezier(.2,.8,.3,1.2) .1s both;
  }

  /* ---------- reveal: poll ---------- */
  .pollrow{padding:13px 0;border-top:1px solid var(--line-soft)}
  .pollrow:first-child{border-top:none;padding-top:4px}
  .pollhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .pollhead .lbl{font-weight:700;font-size:15px}
  .pollhead .num{font-size:13px;color:var(--ink-soft)}
  .lead{font-size:10px;letter-spacing:.12em;color:var(--warm);font-weight:500;margin-left:8px}
  .bartrack{height:13px;border-radius:0 7px 7px 0;background:var(--surface-2);margin:8px 0 7px;overflow:hidden}
  .barfill{
    height:100%;background:linear-gradient(90deg,var(--accent-deep),var(--accent));
    border-radius:0 7px 7px 0;min-width:2px;
    animation:grow .8s cubic-bezier(.25,.9,.3,1) both;
  }
  .pollrow:nth-child(2) .barfill{animation-delay:.08s}
  .pollrow:nth-child(3) .barfill{animation-delay:.16s}
  .pollrow:nth-child(4) .barfill{animation-delay:.24s}
  .pollrow:nth-child(5) .barfill{animation-delay:.32s}
  .voters{font-size:13px;color:var(--ink-soft)}
  .pollnotes{display:flex;flex-direction:column;gap:3px;margin-top:6px}
  .pn{font-size:13px;color:var(--ink-soft);font-style:italic}
  .pn b{color:var(--ink);font-style:normal}
  .pollmedia{margin-top:8px}

  /* ---------- attachments ---------- */
  .attachrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
  .filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;cursor:pointer}
  .filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
  .pendlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .pendlist .chip{padding:3px 8px 3px 12px}
  .pendx{border:none;background:none;color:var(--ink-faint);font-size:14px;padding:0 0 0 5px;line-height:1;cursor:pointer}
  .pendx:hover{color:var(--danger)}
  .media{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .m-item img,.m-item video{max-width:100%;width:100%;border-radius:10px;display:block;border:1px solid var(--line-soft)}
  .m-item audio{width:100%}
  .m-wait{font-size:12.5px;color:var(--ink-faint);background:var(--surface-2);border-radius:10px;padding:14px;text-align:center}

  /* ---------- reveal: letters ---------- */
  .lettergroup{margin-top:18px}
  .letter{
    background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;
    padding:16px 18px;box-shadow:var(--shadow);
    animation:rise .5s cubic-bezier(.2,.7,.2,1) both;
    transition:transform .2s, box-shadow .2s;
  }
  .letter + .letter{margin-top:12px}
  .lettergroup .letter:nth-child(odd){transform:rotate(-.4deg)}
  .lettergroup .letter:nth-child(even){transform:rotate(.35deg)}
  .lettergroup .letter:nth-child(2){animation-delay:.07s}
  .lettergroup .letter:nth-child(3){animation-delay:.14s}
  .lettergroup .letter:nth-child(4){animation-delay:.21s}
  .lettergroup .letter:nth-child(5){animation-delay:.28s}
  .lettergroup .letter:nth-child(n+6){animation-delay:.34s}
  .letter:hover{transform:rotate(0) translateY(-2px);box-shadow:var(--shadow-pop)}
  .letter .from{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
  .letter .who{font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px}
  .letter .when{font-size:11.5px;color:var(--ink-faint)}
  .letter .txt{font-size:15.5px;line-height:1.62;white-space:pre-wrap}
  .reacts{display:flex;gap:6px;margin-top:12px}
  .reacts button{
    border:1px solid var(--line);background:none;border-radius:999px;padding:2px 10px;
    font-size:13px;color:var(--ink-soft);transition:transform .15s, background .15s, border-color .15s;
  }
  .reacts button:hover{transform:scale(1.08);border-color:var(--warm)}
  .reacts button.mine{background:var(--warm-soft);border-color:transparent;color:var(--ink)}

  /* ---------- trends ---------- */
  .trends{background:var(--warm-soft);border-radius:16px;padding:19px 22px;margin-top:14px;animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
  .trends h3{margin:0 0 9px;font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:17.5px}
  .trends h3::before{content:"✦";color:var(--warm);margin-right:8px;font-size:14px}
  .trends ul{margin:0;padding-left:18px}
  .trends li{margin:4px 0;font-size:14.5px}
  .trends .w{font-weight:700}
  .trends .foot{font-size:12.5px;color:var(--ink-soft);margin-top:11px}

  /* ---------- archive ---------- */
  .dayrow{
    display:flex;gap:14px;align-items:baseline;width:100%;text-align:left;
    background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;
    padding:15px 18px;box-shadow:var(--shadow);
    transition:transform .15s, box-shadow .15s, border-color .15s;
  }
  .dayrow:hover{transform:translateY(-1px);box-shadow:var(--shadow-pop);border-color:var(--line)}
  .dayrow + .dayrow{margin-top:11px}
  .dayrow .d{font-size:11.5px;color:var(--ink-soft);min-width:86px;line-height:1.5}
  .dayrow .qq{font-family:'Fraunces',Georgia,serif;font-size:16.5px;font-weight:500;flex:1;line-height:1.3}
  .dayrow .n{font-size:11.5px;color:var(--ink-faint);white-space:nowrap}
  .backrow{margin:18px 0 6px}

  /* ---------- forms / heroes ---------- */
  .field{margin-top:15px}
  .field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
  .field input[type=text], .field select, .field textarea{
    width:100%;border:1px solid var(--line);border-radius:11px;background:var(--ground);
    color:var(--ink);padding:11px 13px;font:inherit;
    transition:border-color .15s, box-shadow .15s;
  }
  .field input[type=text]:focus, .field select:focus, .field textarea:focus{
    outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);
  }
  .field textarea{min-height:78px;resize:vertical}
  .setuphero{text-align:center;margin:52px 0 30px}
  .setuphero h1{
    font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:clamp(32px,7vw,46px);
    margin:0 0 14px;line-height:1.1;text-wrap:balance;letter-spacing:-.012em;
    animation:rise .55s cubic-bezier(.2,.7,.2,1) both;
  }
  .setuphero p{color:var(--ink-soft);max-width:47ch;margin:0 auto;font-size:15.5px;animation:rise .55s cubic-bezier(.2,.7,.2,1) .1s both}
  .teaser{
    margin:0 auto 26px;max-width:460px;text-align:center;
    background:var(--surface);border:1px solid var(--line-soft);border-radius:16px;
    padding:18px 24px;box-shadow:var(--shadow);
    animation:rise .55s cubic-bezier(.2,.7,.2,1) .18s both;
  }
  .teaser .tlabel{display:block;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--warm);margin-bottom:7px}
  .teaser .tq{font-family:'Fraunces',Georgia,serif;font-style:italic;font-size:19px;line-height:1.35;text-wrap:balance}

  /* ---------- identity ---------- */
  .whoami{margin-top:30px}
  .whoami .grid{display:flex;flex-wrap:wrap;gap:9px;margin-top:8px}
  .whoami .grid button{
    display:inline-flex;align-items:center;gap:8px;
    border:1.5px solid var(--line);background:var(--surface);border-radius:999px;
    padding:7px 17px 7px 7px;font-weight:600;font-size:15px;
    transition:border-color .15s, transform .15s;
  }
  .whoami .grid button:hover{border-color:var(--accent);transform:translateY(-1px)}

  /* ---------- misc ---------- */
  .banner{
    border-radius:12px;padding:11px 15px;font-size:13.5px;margin:14px 0 0;
    background:var(--warm-soft);color:var(--ink);
  }
  .toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%);
    background:var(--ink);color:var(--ground);padding:11px 20px;border-radius:999px;
    font-size:14px;font-weight:600;box-shadow:var(--shadow-pop);z-index:50;
    animation:rise .3s cubic-bezier(.2,.7,.2,1) both;
  }
  .yourline{border-left:3px solid var(--warm);padding:2px 0 2px 14px;margin-top:8px}
  .yourline .txt{font-size:15px;white-space:pre-wrap}
  .footer{margin-top:52px;text-align:center;font-size:12px;color:var(--ink-faint)}
  .footer .orn{color:var(--warm);margin-right:6px}

  /* ---------- the wider table ---------- */
  .world{border:1.5px solid var(--accent);border-radius:16px;background:var(--surface);padding:19px 22px;margin:16px 0 14px;box-shadow:var(--shadow);animation:rise .5s cubic-bezier(.2,.7,.2,1) .1s both}
  .world .whead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
  .world .wn{font-size:10.5px;color:var(--ink-faint);letter-spacing:.14em;text-transform:uppercase}
  .world .wline{font-family:'Fraunces',Georgia,serif;font-size:17px;font-weight:500;line-height:1.35;margin-bottom:12px;text-wrap:balance}
  .wlegend{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-soft);margin-bottom:10px}
  .sw{width:16px;height:8px;border-radius:2px;display:inline-block}
  .sw.fam{background:var(--accent)}
  .sw.wor{background:repeating-linear-gradient(45deg,var(--warm) 0 3px,var(--warm-soft) 3px 6px)}
  .wopt{margin:11px 0}
  .wolbl{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13.5px;font-weight:700;margin-bottom:2px}
  .wonum{font-size:11.5px;color:var(--ink-soft);font-weight:400}
  .strack{display:block;height:9px;border-radius:0 5px 5px 0;background:var(--surface-2);overflow:hidden;margin-top:3px}

<script>
(function(){
"use strict";
var TEMPLATE = "<!doctype html>\n" + document.documentElement.outerHTML;

var state = JSON.parse(document.getElementById("state").textContent);
/* v1 states kept members inside groups; flatten them */

var REAL_STATE_JSON = JSON.stringify(state);

/* ---------------- mode: claude artifact vs web rooms ---------------- */
/* Inside the claude.ai artifact runtime the page saves itself (one family per
   artifact). Hosted on the open web it uses family rooms instead: shared state
   in a Firebase Realtime Database, joined by link. */
var IS_ARTIFACT = !!(window.claude && window.claude.use);

/* Family-rooms backend. Two adapters:
   - "clickhouse": a ClickHouse Cloud service over its HTTPS interface, rooms in
     dajia.rooms (see setup-clickhouse.sql). The user below is a sandboxed app
     user that can only SELECT/INSERT that one table.
   - "rest": a Firebase-RTDB-style JSON endpoint; dev-server.py mocks it on
     localhost, which is auto-detected. */
var BACKEND = {type:"clickhouse", url:"https://mezvpvr0xa.us-east-2.aws.clickhouse.cloud:8443", user:"dajia_app", pass:"DT!040d495db9ef05c33b75cd5ax"};
/* local development: dev-server.py mocks both adapters on this origin
   (?chdev exercises the clickhouse adapter instead of the rest one) */
if(/^localhost(:\d+)?$/.test(location.host)){
  if(/[?&]chdev/.test(location.search)) BACKEND = {type:"clickhouse", url:location.origin, user:"dev", pass:"dev"};
  else if(!BACKEND.url) BACKEND = {type:"rest", url:location.origin};
}

function roomsEnabled(){ return !IS_ARTIFACT && !!BACKEND.url; }
function dbPath(id){ return BACKEND.url.replace(/\/+$/,"") + "/rooms/" + encodeURIComponent(id) + ".json"; }
function chQuery(query, params, body){
  var p = new URLSearchParams();
  p.set("add_http_cors_header", "1");
  p.set("user", BACKEND.user);
  p.set("password", BACKEND.pass);
  p.set("query", query);
  Object.keys(params || {}).forEach(function(k){ p.set("param_" + k, params[k]); });
  /* string body + no custom headers keeps this a CORS "simple request" */
  return fetch(BACKEND.url.replace(/\/+$/,"") + "/?" + p.toString(),
    body !== undefined ? {method:"POST", body:body} : {method:"POST"})
    .then(function(r){
      if(!r.ok) return r.text().then(function(t){ throw new Error("clickhouse " + r.status + " " + t.slice(0,200)); });
      return r.text();
    });
}
function apiLoad(id){
  if(BACKEND.type === "clickhouse"){
    return chQuery("SELECT data FROM dajia.rooms FINAL WHERE id = {id:String} LIMIT 1 FORMAT JSONEachRow", {id:id})
      .then(function(text){
        var line = text.trim().split("\n")[0];
        if(!line) return null;
        return JSON.parse(JSON.parse(line).data);
      });
  }
  return fetch(dbPath(id)).then(function(r){ if(!r.ok) throw new Error("load " + r.status); return r.json(); });
}
function apiSave(id, data){
  if(BACKEND.type === "clickhouse"){
    return chQuery("INSERT INTO dajia.rooms (id, data) FORMAT JSONEachRow", {},
      JSON.stringify({id:id, data:JSON.stringify(data)})).then(function(){});
  }
  return fetch(dbPath(id), {method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(data)})
    .then(function(r){ if(!r.ok) throw new Error("save " + r.status); });
}

/* ---------------- media attachments ---------------- */
var pendingMedia = [];   /* [{kind, mime, b64, bytes, label}] awaiting submit */
var mediaCache = {};     /* id -> {url} | "loading" | null */
var recState = null;     /* {rec, secs, timer} while a voice memo records */
var MEDIA_MAX = 8 * 1024 * 1024;

function mediaOn(){ return !IS_ARTIFACT && !sampleMode && BACKEND.type === "clickhouse" && !!BACKEND.url; }

function fileToB64(fileOrBlob){
  return new Promise(function(res, rej){
    var r = new FileReader();
    r.onload = function(){ var s = String(r.result); res(s.slice(s.indexOf(",") + 1)); };
    r.onerror = rej;
    r.readAsDataURL(fileOrBlob);
  });
}
function shrinkImage(file){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function(){
      var MAX = 1600, w = img.width, h = img.height;
      var s = Math.min(1, MAX / Math.max(w, h));
      var c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(w * s)); c.height = Math.max(1, Math.round(h * s));
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      var dataUrl = c.toDataURL("image/jpeg", 0.82);
      res({mime:"image/jpeg", b64:dataUrl.slice(dataUrl.indexOf(",") + 1)});
    };
    img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error("image")); };
    img.src = url;
  });
}
function fmtBytes(n){ return n > 900000 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB"; }
function addPendingFile(file){
  if(pendingMedia.length >= 3){ toast("Three attachments is plenty for one answer"); return; }
  if((file.type || "").indexOf("image/") === 0){
    shrinkImage(file).then(function(out){
      pendingMedia.push({kind:"photo", mime:out.mime, b64:out.b64, bytes:Math.round(out.b64.length * 0.75), label:file.name || "photo"});
      render();
    }, function(){ toast("Couldn't read that image"); });
  } else if((file.type || "").indexOf("video/") === 0){
    if(file.size > MEDIA_MAX){ toast("Keep videos under 8 MB — roughly 20–30 seconds"); return; }
    fileToB64(file).then(function(b64){
      pendingMedia.push({kind:"video", mime:file.type, b64:b64, bytes:file.size, label:file.name || "video"});
      render();
    }, function(){ toast("Couldn't read that video"); });
  } else {
    toast("Photos and videos here — use the memo button for audio");
  }
}
function startRec(){
  if(recState) return;
  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder)){
    toast("Voice memos aren't supported in this browser"); return;
  }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    var mime = "";
    if(MediaRecorder.isTypeSupported){
      if(MediaRecorder.isTypeSupported("audio/webm")) mime = "audio/webm";
      else if(MediaRecorder.isTypeSupported("audio/mp4")) mime = "audio/mp4";
    }
    var rec;
    try{ rec = mime ? new MediaRecorder(stream, {mimeType:mime}) : new MediaRecorder(stream); }
    catch(_e){ stream.getTracks().forEach(function(t){ t.stop(); }); toast("Couldn't start recording"); return; }
    var chunks = [];
    rec.ondataavailable = function(ev){ if(ev.data && ev.data.size) chunks.push(ev.data); };
    rec.onstop = function(){
      stream.getTracks().forEach(function(t){ t.stop(); });
      var secs = recState ? recState.secs : 0;
      if(recState) clearInterval(recState.timer);
      recState = null;
      var blob = new Blob(chunks, {type: rec.mimeType || mime || "audio/webm"});
      if(!blob.size){ render(); return; }
      if(blob.size > MEDIA_MAX){ toast("That memo is too big — try under 90 seconds"); render(); return; }
      fileToB64(blob).then(function(b64){
        pendingMedia.push({kind:"audio", mime:blob.type, b64:b64, bytes:blob.size, label:"voice memo · " + secs + "s"});
        render();
      }, function(){ toast("Couldn't save the memo"); render(); });
    };
    recState = {rec:rec, secs:0, timer:setInterval(function(){
      if(!recState) return;
      recState.secs++;
      var t = document.getElementById("rectime");
      if(t) t.textContent = recState.secs + "s";
      if(recState.secs >= 90) stopRec();
    }, 1000)};
    rec.start();
    render();
  }, function(){ toast("Microphone permission is needed for voice memos"); });
}
function stopRec(){ if(recState && recState.rec.state !== "inactive") recState.rec.stop(); }

function uploadPending(){
  if(!pendingMedia.length) return Promise.resolve([]);
  var refs = [], chain = Promise.resolve();
  pendingMedia.forEach(function(p){
    chain = chain.then(function(){
      var id = uid() + uid();
      return chQuery("INSERT INTO dajia.media (id, room, kind, mime, bytes, data) FORMAT JSONEachRow", {},
        JSON.stringify({id:id, room:roomId, kind:p.kind, mime:p.mime, bytes:p.bytes, data:p.b64}))
        .then(function(){ refs.push({id:id, kind:p.kind, mime:p.mime, bytes:p.bytes}); });
    });
  });
  return chain.then(function(){ return refs; });
}
function loadMedia(id){
  if(mediaCache[id]) return;
  mediaCache[id] = "loading";
  chQuery("SELECT mime, data FROM dajia.media WHERE id = {id:String} LIMIT 1 FORMAT JSONEachRow", {id:id})
    .then(function(text){
      var line = text.trim().split("\n")[0];
      if(!line){ mediaCache[id] = null; updateMediaDom(id); return; }
      var row = JSON.parse(line);
      mediaCache[id] = {url:"data:" + row.mime + ";base64," + row.data};
      updateMediaDom(id);
    }, function(){ mediaCache[id] = null; updateMediaDom(id); });
}
function mediaPlayerHTML(kind, url){
  if(kind === "photo") return '<img src="' + url + '" alt="">';
  if(kind === "video") return '<video src="' + url + '" controls playsinline></video>';
  return '<audio src="' + url + '" controls></audio>';
}
function updateMediaDom(id){
  var els = document.querySelectorAll('[data-mid="' + id + '"]');
  for(var i = 0; i < els.length; i++){
    var c = mediaCache[id];
    if(c === "loading") continue;
    if(!c){ els[i].innerHTML = '<span class="hint">attachment unavailable</span>'; continue; }
    els[i].innerHTML = mediaPlayerHTML(els[i].getAttribute("data-kind"), c.url);
  }
}
function renderMediaList(media){
  if(!media || !media.length || !mediaOn()) return "";
  return '<div class="media">' + media.map(function(m){
    var c = mediaCache[m.id];
    if(c && c !== "loading") return '<div class="m-item" data-mid="' + m.id + '" data-kind="' + m.kind + '">' + mediaPlayerHTML(m.kind, c.url) + '</div>';
    if(m.kind === "photo"){
      loadMedia(m.id);
      return '<div class="m-item m-wait" data-mid="' + m.id + '" data-kind="photo">loading photo…</div>';
    }
    var lbl = (m.kind === "video" ? "▶ Play video" : "▶ Play voice memo") + " · " + fmtBytes(m.bytes || 0);
    return '<div class="m-item" data-mid="' + m.id + '" data-kind="' + m.kind + '"><button class="btn ghost small" data-act="loadmedia" data-mid="' + m.id + '">' + lbl + '</button></div>';
  }).join("") + '</div>';
}
function attachUI(){
  if(!mediaOn()) return "";
  var h = '<div class="attachrow">';
  h += '<label class="btn ghost small filebtn">📎 Photo / video<input type="file" id="mediafile" accept="image/*,video/*"></label>';
  if(recState) h += '<button class="btn small" data-act="recstop">■ Stop · <span id="rectime" class="mono">' + recState.secs + 's</span></button>';
  else h += '<button class="btn ghost small" data-act="recstart">🎙 Voice memo</button>';
  h += '</div>';
  if(pendingMedia.length){
    h += '<div class="pendlist">' + pendingMedia.map(function(p, i){
      return '<span class="chip">' + esc(p.label) + ' <span class="mono">' + fmtBytes(p.bytes) + '</span>' +
        '<button class="pendx" data-act="unattach" data-i="' + i + '" aria-label="Remove attachment">×</button></span>';
    }).join("") + '</div>';
  }
  return h;
}

/* ---------------- table talk (per-day chat) ---------------- */
var chatCache = {};      /* key -> {msgs:[{id,member,text,at}], loading} */
var chatDraft = "";
var chatReplyTo = null;   /* message id being replied to */
var sampleChat = null, sampleChatReacts = null;
function chatOn(){ return sampleMode || (BACKEND.type === "clickhouse" && !!BACKEND.url && !!roomId); }
function chatKey(day){ return (sampleMode ? "sample" : roomId) + "|" + day; }
function chatEntry(day){
  var k = chatKey(day);
  if(!chatCache[k]) chatCache[k] = {msgs:[], reacts:{}, loading:false, loaded:false};
  return chatCache[k];
}
function loadChat(day){
  if(!chatOn()) return;
  if(sampleMode){
    var se = chatEntry(day);
    if(!se.loaded){
      se.loaded = true;
      if(sampleChat && sampleChat[day]) se.msgs = sampleChat[day].slice();
      if(sampleChatReacts && sampleChatReacts[day]) se.reacts = sampleChatReacts[day];
    }
    return;
  }
  var entry = chatEntry(day);
  if(entry.loading) return;
  entry.loading = true;
  Promise.all([
    chQuery("SELECT id, member, text, reply, toUnixTimestamp64Milli(at) AS at FROM dajia.chat WHERE room = {r:String} AND day = {d:String} ORDER BY at LIMIT 500 FORMAT JSONEachRow", {r:roomId, d:day}),
    chQuery("SELECT msg, emoji, member FROM (SELECT msg, emoji, member, argMax(op, at) AS o FROM dajia.chat_reacts WHERE room = {r:String} AND day = {d:String} GROUP BY msg, emoji, member) WHERE o = 1 FORMAT JSONEachRow", {r:roomId, d:day})
  ]).then(function(results){
      entry.loading = false;
      var server = results[0].trim() ? results[0].trim().split("\n").map(function(l){
        var row = JSON.parse(l);
        return {id:row.id, member:row.member, text:row.text, reply:row.reply || "", at:Number(row.at)};
      }) : [];
      var seen = {};
      server.forEach(function(m){ seen[m.id] = true; });
      /* keep optimistic messages the server hasn't confirmed yet */
      entry.msgs.forEach(function(m){ if(!seen[m.id]) server.push(m); });
      var reacts = {};
      if(results[1].trim()) results[1].trim().split("\n").forEach(function(l){
        var row = JSON.parse(l);
        var slot = reacts[row.msg] = reacts[row.msg] || {};
        (slot[row.emoji] = slot[row.emoji] || []).push(row.member);
      });
      var changed = JSON.stringify([server, reacts]) !== JSON.stringify([entry.msgs, entry.reacts]);
      entry.msgs = server;
      entry.reacts = reacts;
      entry.loaded = true;
      if(changed) updateChatDom(day);
    }, function(){ entry.loading = false; entry.loaded = true; updateChatDom(day); });
}
function toggleChatReact(day, msgId, emoji){
  var meNow = getMe();
  if(!meNow) return;
  var entry = chatEntry(day);
  var slot = entry.reacts[msgId] = entry.reacts[msgId] || {};
  var arr = slot[emoji] = slot[emoji] || [];
  var ix = arr.indexOf(meNow.id);
  var op = ix >= 0 ? -1 : 1;
  if(ix >= 0) arr.splice(ix, 1); else arr.push(meNow.id);
  if(!arr.length) delete slot[emoji];
  updateChatDom(day);
  if(sampleMode) return;
  chQuery("INSERT INTO dajia.chat_reacts (room, day, msg, member, emoji, op) FORMAT JSONEachRow", {},
    JSON.stringify({room:roomId, day:day, msg:msgId, member:meNow.id, emoji:emoji, op:op}))
    .then(function(){}, function(){ toast("Couldn't react — check your connection"); });
}
function updateChatDom(day){
  var list = document.getElementById("chatlist");
  if(!list || list.getAttribute("data-day") !== day) return;
  var entry = chatEntry(day);
  var nearBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 80;
  list.innerHTML = chatMsgsHTML(day);
  var count = document.getElementById("chatcount");
  if(count) count.textContent = entry.msgs.length ? String(entry.msgs.length) : "";
  if(nearBottom) list.scrollTop = list.scrollHeight;
}
function chatMsgsHTML(day){
  var entry = chatEntry(day);
  if(!entry.msgs.length) return '<div class="hint" style="padding:6px 2px">Nothing yet — say the first word.</div>';
  var meNow = getMe();
  var byId = {};
  entry.msgs.forEach(function(m){ byId[m.id] = m; });
  return entry.msgs.map(function(m){
    var who = memberById(m.member);
    var name = who ? who.name : "someone";
    var mine = meNow && meNow.id === m.member;
    var t = m.at ? new Date(m.at).toLocaleTimeString(undefined, {hour:"numeric", minute:"2-digit"}) : "";
    var r = entry.reacts[m.id] || {};
    var quote = "";
    if(m.reply){
      var p = chatParentInfo(day, m.reply, byId);
      quote = '<span class="mq" data-act="chatjump" data-msg="' + esc(m.reply) + '">' +
        '<b>' + esc(p.label) + '</b> ' + esc(p.text) + '</span>';
    }
    var reactBtns = EMOJI.map(function(em){
      var arr = r[em] || [];
      var iReacted = meNow && arr.indexOf(meNow.id) >= 0;
      var names = arr.map(function(id){ var mm = memberById(id); return mm ? mm.name : ""; }).filter(Boolean).join(", ");
      return '<button class="mre' + (arr.length ? " has" : "") + (iReacted ? " mine" : "") + '" data-act="chatreact" ' +
        'data-day="' + day + '" data-msg="' + m.id + '" data-e="' + esc(em) + '" title="' + esc(names) + '">' +
        em + (arr.length ? ' <span class="mono">' + arr.length + '</span>' : "") + '</button>';
    }).join("");
    if(meNow) reactBtns += '<button class="mre mrep" data-act="chatreplyto" data-day="' + day + '" data-msg="' + m.id + '">↩ reply</button>';
    return '<div class="msg' + (mine ? " mine" : "") + '" id="msg-' + m.id + '" style="--avh:' + hueFor(name) + '">' + avHTML(name) +
      '<div class="mb"><span class="mh"><span class="mn">' + esc(name) + '</span><span class="mt mono">' + t + '</span></span>' +
      quote +
      '<span class="mx">' + esc(m.text) + '</span>' +
      (meNow || Object.keys(r).length ? '<span class="mreacts">' + reactBtns + '</span>' : '') +
      '</div></div>';
  }).join("");
}
/* resolve what a reply ref points at: "a:<memberId>" is that member's answer
   for the day; anything else is a chat message id */
function chatParentInfo(day, ref, msgsById){
  var text, label, target;
  if(ref.indexOf("a:") === 0){
    var mid = ref.slice(2);
    var d = state.days[day];
    var ans = d && d.answers ? d.answers[mid] : null;
    var who = memberById(mid);
    var qq = (d && d.q) ? d.q : questionForDate(day);
    text = ans ? (ans.text != null ? ans.text : (qq.o && qq.o[ans.choice] != null ? qq.o[ans.choice] : "")) : "";

function normalizeRoom(room){
  /* the database prunes empty objects, so restore them */
  room.members = room.members || [];
  room.days = room.days || {};
  Object.keys(room.days).forEach(function(k){
    room.days[k].answers = room.days[k].answers || {};
    room.days[k].reactions = room.days[k].reactions || {};
  });
  room.setup = true;

}

/* fold my local changes onto the freshest copy so two people saving at once

function mergeRoom(remote, mine){
  var out = remote;
  out.familyName = mine.familyName; out.tz = mine.tz; out.revealHour = mine.revealHour;
  out.createdAt = out.createdAt || mine.createdAt;
  var ids = {};
  out.members.forEach(function(m){ ids[m.id] = true; });
  (mine.members || []).forEach(function(m){ if(!ids[m.id]) out.members.push(m); });
  Object.keys(mine.days || {}).forEach(function(k){
    var md = mine.days[k], rd = out.days[k];
    if(!rd){ out.days[k] = md; return; }
    /* a re-rolled question wins only while nobody anywhere has answered */
    var rdAns = Object.keys(rd.answers || {}).length, mdAns = Object.keys(md.answers || {}).length;
    rd.q = (md.q && !rdAns && !mdAns) ? md.q : (rd.q || md.q);
    Object.keys(md.answers || {}).forEach(function(mid){
      var ra = rd.answers[mid], ma = md.answers[mid];
      if(!ra || (ma.at || 0) >= (ra.at || 0)) rd.answers[mid] = ma;
    });
    Object.keys(md.reactions || {}).forEach(function(t){
      var rt = rd.reactions[t] = rd.reactions[t] || {};
      Object.keys(md.reactions[t]).forEach(function(em){ rt[em] = md.reactions[t][em]; });
    });
  });

/* day keys can carry a round suffix: "2026-08-28", "2026-08-28#2", ... —
   a table can run several questions in one day once a round completes */
function baseOf(key){ return key.split("#")[0]; }
function roundOf(key){ var p = key.split("#"); return p[1] ? +p[1] : 1; }
function currentRoundKey(){
  var base = famParts().dateKey, best = base, bestN = 1;
  Object.keys(state.days).forEach(function(k){
    if(baseOf(k) === base && roundOf(k) >= bestN){ bestN = roundOf(k); best = k; }
  });
  return best;
}

/* deterministic pick: same question for everyone on a given family-date */
function questionForDate(dateKey){
  var d = state.days[dateKey];
  if(d && d.q) return d.q; /* snapshotted on first answer, stable forever */
  var parts = baseOf(dateKey).split("-");
  var ord = Math.round(Date.UTC(+parts[0], +parts[1]-1, +parts[2]) / 86400000);
  return QBANK[((ord*37) % QBANK.length + QBANK.length) % QBANK.length];
}

/* ---------------- family clock ---------------- */
function famParts(tzArg){
  var tz = tzArg || state.tz || Intl.DateTimeFormat().resolvedOptions().timeZone;
  var f = new Intl.DateTimeFormat("en-CA",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false});
  var p = {};
  f.formatToParts(new Date()).forEach(function(x){ p[x.type]=x.value; });
  var hour = +p.hour; if(hour===24) hour=0;
  return {dateKey:p.year+"-"+p.month+"-"+p.day, hour:hour, minute:+p.minute, tz:tz};
}
function prettyDate(dateKey, opts){
  var parts = baseOf(dateKey).split("-");
  var d = new Date(Date.UTC(+parts[0], +parts[1]-1, +parts[2], 12));
  return d.toLocaleDateString(undefined, opts || {weekday:"long", month:"long", day:"numeric"});
}
function dayNumber(dateKey){
  if(!state.createdAt) return 1;
  function ord(k){ var p=baseOf(k).split("-"); return Math.round(Date.UTC(+p[0],+p[1]-1,+p[2])/86400000); }
  return Math.max(1, ord(dateKey) - ord(state.createdAt) + 1);
}

/* ---------------- state helpers ---------------- */
function memberById(id){ return state.members.find(function(m){return m.id===id;}) || null; }
function day(dateKey){ return state.days[dateKey] || {answers:{}, reactions:{}}; }
function ensureDay(dateKey){
  if(!state.days[dateKey]) state.days[dateKey] = {q:questionForDate(dateKey), answers:{}, reactions:{}};
  if(!state.days[dateKey].q) state.days[dateKey].q = questionForDate(dateKey);
  if(!state.days[dateKey].reactions) state.days[dateKey].reactions = {};
  return state.days[dateKey];
}
function familyAnswered(dateKey){
  var d = day(dateKey);
  return state.members.length>0 && state.members.every(function(m){ return !!d.answers[m.id]; });
}
function isUnlocked(dateKey){
  var now = famParts();
  if(baseOf(dateKey) < now.dateKey) return true;         /* past days are always open */
  if(dateKey !== currentRoundKey()) return true;         /* finished rounds of today too */
  if(now.hour >= (state.revealHour||18)) return true;    /* 6:00 PM at the family table */
  return familyAnswered(dateKey);                        /* the whole family is in */
}
function minutesToReveal(){
  var now = famParts();
  return Math.max(0, (state.revealHour||18)*60 - (now.hour*60+now.minute));
}

  if(sampleMode) return sampleMe ? memberById(sampleMe) : null;
  var id = null;
  if(IS_ARTIFACT){
    /* fall back to the pre-rename key so nobody has to re-pick themselves */
    try{ id = localStorage.getItem(LS_ME) || localStorage.getItem("sametable.me"); }catch(_e){}
  } else if(roomId){
    id = (roomsMap()[roomId] || {}).me;
  }
  return id ? memberById(id) : null;
}
function setMe(id){
  if(sampleMode){ sampleMe = id; render(); return; }
  if(IS_ARTIFACT){
    try{ localStorage.setItem(LS_ME, id); }catch(_e){}
  } else {
    rememberRoom(roomId, id, state.familyName);
  }
  render();
}
function forgetMe(){
  if(IS_ARTIFACT){
    try{ localStorage.removeItem(LS_ME); localStorage.removeItem("sametable.me"); }catch(_e){}
  } else {
    rememberRoom(roomId, null, state.familyName);
  }
}

/* ---------------- trends (free-form reveal) ---------------- */
var STOP = ("the a an and or but if then than that this those these i you he she it we they them his her my your our their of in on at to for with from by about as is are was were be been being am do does did have has had not no yes so just very really too also there here when what who whom whose which why how all any some one two few more most other own same its im dont didnt cant wont isnt thats youre were theyre will would can could should shall may might must out up down over under again once because while during before after above below off only still ever never always sometimes lot bit thing things stuff way ways got get gets getting go goes going went come came like even much many back now new old good great little every each").split(" ");
function computeTrends(entries){
  /* entries: [{name, text, at}] */
  var byWord = {}, freq = {};
  entries.forEach(function(e){
    var seen = {};
    var words = (e.text.toLowerCase().match(new RegExp("[a-z\\u00C0-\\u024F\\u0400-\\u04FF'-]{3,}","g")) || []);
    words.forEach(function(w){
      w = w.replace(/^['-]+|['-]+$/g,"").replace(/'/g,"");
      if(w.length<3 || STOP.indexOf(w)>=0) return;
      freq[w] = (freq[w]||0)+1;
      if(!seen[w]){ seen[w]=true; (byWord[w]=byWord[w]||[]).push(e.name); }
    });
  });
  var shared = Object.keys(byWord).filter(function(w){ return byWord[w].length>=2; })
    .sort(function(a,b){ return byWord[b].length-byWord[a].length || freq[b]-freq[a]; }).slice(0,6)
    .map(function(w){ return {word:w, people:byWord[w]}; });
  var first = entries.slice().sort(function(a,b){ return (a.at||0)-(b.at||0); })[0];
  var longest = entries.slice().sort(function(a,b){ return b.text.length-a.text.length; })[0];
  return {shared:shared, first:first, longest:longest};
}

/* ---------------- rendering ---------------- */
var view = "today";      /* today | archive | family | day:YYYY-MM-DD */
var draftText = "";
var draftChoice = null;
var draftNote = "";
var editingAnswer = false;
var app = document.getElementById("app");

function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function toast(msg){
  var t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 3200);
}
function uid(){ return Math.random().toString(36).slice(2,9); }
function hueFor(name){
  var h = 0;
  for(var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return h % 360;
}
function avHTML(name, done){
  var ini = (String(name).trim().charAt(0) || "?").toUpperCase();
  return '<span class="av">' + (done ? "✓" : esc(ini)) + '</span>';
}
function chipHTML(m, done, isMe){
  return '<span class="chip' + (done ? " done" : "") + (isMe ? " me" : "") + '" style="--avh:' + hueFor(m.name) + '">' +
    avHTML(m.name, done) + esc(m.name) + '</span>';
}
function sprig(){
  return '<div class="sprig" aria-hidden="true"><svg viewBox="0 0 56 12" width="56" height="12" fill="none">' +
    '<path d="M2 6h18M36 6h18" stroke="currentColor" stroke-width="1"/>' +
    '<circle cx="28" cy="6" r="2.4" fill="currentColor"/>' +
    '<circle cx="21.5" cy="6" r="1.2" fill="currentColor" opacity=".55"/>' +
    '<circle cx="34.5" cy="6" r="1.2" fill="currentColor" opacity=".55"/></svg></div>';
}

function render(){
  if(!sampleMode){
    if(IS_ARTIFACT){
      if(!state.setup){ app.innerHTML = renderSetup(); return; }
    } else {
      if(!roomId){ app.innerHTML = renderLanding(); return; }
      if(!roomsEnabled()){ app.innerHTML = renderNoBackend(); return; }
      if(roomLoading){ app.innerHTML = renderShell("Setting the table…"); return; }
      if(roomError){ app.innerHTML = renderRoomError(); return; }
      if(!state.setup){ app.innerHTML = renderShell("…"); return; }
    }
  }
  var me = getMe();
  var html = renderHeader(me);
  if(!me && view === "today"){
    html += (IS_ARTIFACT || sampleMode) ? renderWhoAmI() : renderJoin();
  } else if(view === "today"){
    html += renderDay(currentRoundKey(), me, true);
  } else if(view === "archive"){
    html += renderArchive();
  } else if(view === "family"){
    html += renderFamily(me);
  } else if(view.indexOf("day:")===0){
    html += '<div class="backrow"><button class="linkbtn" data-act="goto" data-v="archive">← All days</button></div>';
    html += renderDay(view.slice(4), me, false);
  }
  html += '<div class="footer"><span class="orn">❧</span>Dajia Talks · one question a day, answered together</div>';
  app.innerHTML = html;
  var cl = document.getElementById("chatlist");
  if(cl) cl.scrollTop = cl.scrollHeight;
}

function renderHeader(me){
  var tabs = [["today","Today"],["archive","Past days"],["family","Family"]];
  var cur = view.indexOf("day:")===0 ? "archive" : view;
  var h = '<header><div class="wordmark">Dajia Talks<span class="dot">.</span><span class="cjk" aria-hidden="true">大家</span></div>' +
    '<div class="famname">' + esc(state.familyName) + (me ? '<br><span class="mono" style="font-size:11px">you are ' + esc(me.name) + ' · <button class="linkbtn" style="font-size:11px" data-act="switchme">switch</button></span>' : "") + '</div></header>';
  h += '<nav class="tabs">' + tabs.map(function(t){
    return '<button data-act="goto" data-v="' + t[0] + '" class="' + (cur===t[0]?"on":"") + '">' + t[1] + '</button>';
  }).join("") + '</nav>';
  if(sampleMode) h += '<div class="banner">You’re exploring a <b>sample family</b> — nothing is saved. <button class="linkbtn" data-act="exitsample">Exit sample</button></div>';
  else if(IS_ARTIFACT && nsResolved && !artifactNS) h += '<div class="banner">Preview mode: this device only. Open the published page on claude.ai so answers save for everyone.</div>';
  else if(IS_ARTIFACT && readOnly) h += '<div class="banner">You have view-only access. Ask the family to share this page with edit access so you can answer.</div>';
  return h;
}

function renderWhoAmI(){
  var h = '<div class="whoami"><div class="sectionhead">Who are you?</div>' +
    '<p class="hint">Pick yourself once on this device — your answers will be signed with this name.</p>';
  h += '<div class="grid">' +
    state.members.map(function(m){ return '<button data-act="pickme" data-id="' + m.id + '" style="--avh:' + hueFor(m.name) + '">' + avHTML(m.name) + esc(m.name) + '</button>'; }).join("") + '</div>';
  h += '<div style="margin-top:22px" class="hint">Not listed? ' +
    '<button class="linkbtn" data-act="gotofamily">Add yourself in Family</button></div></div>';
  return h;
}

function renderDay(dateKey, me, isToday){
  var q = questionForDate(dateKey);
  var d = day(dateKey);
  var myAns = me ? d.answers[me.id] : null;
  var unlocked = isUnlocked(dateKey);
  var clock = famParts();
  var h = "";

  if(isToday){
    h += '<div class="clockline mono">' + prettyDate(dateKey) + " · " +
      String(clock.hour).padStart(2,"0") + ":" + String(clock.minute).padStart(2,"0") +
      " at the family table (" + esc((state.tz||clock.tz).split("/").pop().replace(/_/g," ")) + ")</div>";
  }

  h += '<div class="eyebrow"><span class="mono">Day ' + dayNumber(dateKey) + (roundOf(dateKey) > 1 ? ' · №' + roundOf(dateKey) : '') + '</span><span class="sep">·</span>' +
       '<span class="tag">' + esc(q.tag) + '</span><span class="sep">·</span>' +
       '<span>' + (q.t==="poll" ? "Poll" : "Open answer") + '</span></div>';
  h += '<h1 class="q">' + esc(q.q) + '</h1>' + sprig();
  if(!isToday) h += '<p class="qsub">' + prettyDate(dateKey, {weekday:"long", year:"numeric", month:"long", day:"numeric"}) + '</p>';
  else h += '<p class="qsub">Everyone gets this question today. Answers open when the whole family is in — or at ' + revealLabel() + '.</p>';
  if(isToday && !readOnly && !Object.keys(d.answers).length){
    h += '<div class="reroll"><button class="linkbtn" data-act="reroll">↻ Try a different question</button></div>';
  }

  /* composer / my answer (once the table is open, your answer lives in the list) */
  if(isToday && !readOnly){
    if(!myAns || editingAnswer){
      h += renderComposer(q, myAns);
    } else if(!unlocked){
      h += '<div class="card"><div class="sectionhead">Your answer</div><div class="yourline">' +
        (q.t==="poll" ? '<div class="txt"><b>' + esc(q.o[myAns.choice]) + '</b>' + (myAns.note ? ' — “' + esc(myAns.note) + '”' : '') + '</div>'
                      : '<div class="txt">' + esc(myAns.text) + '</div>') +
        '</div>' + renderMediaList(myAns.media) +
        '<div class="btnrow"><button class="btn ghost small" data-act="editans">Change answer</button></div>' +
        '</div>';
    }
  }

  /* presence */
  h += '<div class="card presence" style="margin-top:14px"><h3>Around the table</h3>' + renderPresence(dateKey, me) + '</div>';

  /* reveal or lock */
  if(unlocked){
    h += renderReveal(dateKey, q, me, isToday);
    if(isToday && !readOnly && me && familyAnswered(dateKey)){
      h += '<div class="btnrow" style="justify-content:center;margin:22px 0 4px">' +
        '<button class="btn" data-act="newround">Ask another question</button></div>' +
        '<p class="hint" style="text-align:center;margin-top:6px">This round moves to Past days, and the table gets a fresh question.</p>';
    }
  } else {
    var mins = minutesToReveal();
    var cd = mins>=60 ? Math.floor(mins/60) + "h " + (mins%60) + "m" : mins + "m";
    h += '<div class="card lock"><div class="seal" aria-hidden="true">封</div><div class="sectionhead">Answers are sealed</div>' +
      '<div class="big">The table opens when everyone in ' + esc(state.familyName) + ' has answered</div>' +
      '<div class="hint">or at ' + revealLabel() + ' — <span class="count mono" data-countdown>' + cd + '</span> from now, whichever comes first.</div></div>';
  }
  h += renderChat(dateKey, me);
  return h;
}

function revealLabel(){
  var hr = state.revealHour||18;
  return (hr>12? hr-12 : hr) + ":00 " + (hr>=12?"PM":"AM");
}

function renderComposer(q, myAns){
  var h = '<div class="card composer"><div class="sectionhead">' + (myAns ? "Change your answer" : "Your answer") + '</div>';
  if(q.t==="poll"){
    var sel = draftChoice!=null ? draftChoice : (myAns ? myAns.choice : null);
    h += '<div class="polloptions">' + q.o.map(function(o,i){
      return '<button class="opt' + (sel===i?" sel":"") + '" data-act="pickopt" data-i="' + i + '"><span class="radio"></span>' + esc(o) + '</button>';
    }).join("") + '</div>';
    if(sel != null && q.f && q.f[sel]){
      var noteVal = draftNote || (myAns && myAns.note ? myAns.note : "");
      h += '<div class="field"><label for="pollnote">' + esc(q.f[sel]) + ' <span class="hint" style="font-weight:400">(optional)</span></label>' +
        '<input type="text" id="pollnote" maxlength="200" placeholder="A few words is plenty" value="' + esc(noteVal) + '"></div>';
    }
    h += attachUI();
    h += '<div class="btnrow"><button class="btn" data-act="submit" ' + (sel==null?"disabled":"") + '>Lock it in</button>';
  } else {
    var val = draftText || (myAns ? myAns.text : "");
    h += '<textarea id="freetext" placeholder="Take your time — a few sentences is perfect.">' + esc(val) + '</textarea>';
    h += attachUI();
    h += '<div class="btnrow"><button class="btn" data-act="submit">Send to the table</button>';
  }
  if(myAns) h += '<button class="btn ghost" data-act="canceledit">Cancel</button>';
  h += '<span class="hint">Hidden from everyone until the reveal.</span></div></div>';
  return h;
}

function renderPresence(dateKey, me){
  var d = day(dateKey);
  var n = state.members.filter(function(m){ return !!d.answers[m.id]; }).length;
  return '<div class="grouprow"><span class="gname mono">' + n + ' of ' + state.members.length + ' in</span><span class="chips">' +
    state.members.map(function(m){
      return chipHTML(m, !!d.answers[m.id], me && m.id === me.id);
    }).join("") + '</span></div>';
}

function renderReveal(dateKey, q, me, isToday){
  var d = day(dateKey);
  var entries = [];
  state.members.forEach(function(m){
    var a = d.answers[m.id];
    if(a) entries.push({id:m.id, name:m.name, ans:a});
  });
  /* your own answer leads the list */
  if(me) entries.sort(function(a, b){ return (b.id === me.id ? 1 : 0) - (a.id === me.id ? 1 : 0); });
  if(!entries.length){
    return '<div class="card lock"><div class="big">No answers made it in ' + (isToday?'yet':'this day') + '.</div>' +
      (isToday ? '<div class="hint">The table is open — add yours above and it appears here.</div>' : '') + '</div>';
  }
  var h = '<div style="margin-top:26px"><div class="sectionhead" style="text-align:center">The table is open · ' + entries.length + ' answer' + (entries.length===1?"":"s") + '</div>';
  h += renderWorld(q, entries);
  if(q.t==="poll") h += renderPollReveal(q, entries);
  else h += renderLetters(dateKey, q, entries, me);
  h += '</div>';
  return h;
}

var SENTS = [["warm","Warm"],["funny","Funny"],["wistful","Wistful"],["thoughtful","Thoughtful"]];
function familyWordSet(entries){
  var set = {};
  entries.forEach(function(e){
    var t = (e.ans.text || "").toLowerCase();
    (t.match(new RegExp("[a-z\\u00C0-\\u024F\\u0400-\\u04FF'-]{3,}","g")) || []).forEach(function(w){
      w = w.replace(/^['-]+|['-]+$/g,"").replace(/'/g,"");
      if(w.length >= 3 && STOP.indexOf(w) < 0) set[w] = true;
    });
  });
  return set;
}
function renderWorld(q, entries){
  if(BACKEND.type !== "clickhouse" || !BACKEND.url) return "";
  var qi = worldQi(q);
  if(qi < 0) return "";
  var w = worldCache[qi];
  if(w === undefined){ loadWorld(qi); return ""; }
  if(!w || w === "loading") return "";
  var h = '<div class="world"><div class="whead"><span class="sectionhead" style="margin:0;color:var(--accent)">Beyond your table</span>' +
    '<span class="wn mono">panel of ' + w.n + '</span></div>';
  h += '<div class="wline">' + esc(w.line) + '</div>';
  if(w.type === "poll" && q.o){
    var famCounts = q.o.map(function(){ return 0; });
    entries.forEach(function(e){ if(famCounts[e.ans.choice] != null) famCounts[e.ans.choice]++; });
    var famTotal = entries.length || 1;
    h += '<div class="wlegend"><span class="sw fam"></span>your table<span class="sw wor" style="margin-left:14px"></span>the world</div>';
    q.o.forEach(function(o, i){
      var fp = Math.round((famCounts[i] / famTotal) * 100);
      var wp = w.votes[i] || 0;
      h += '<div class="wopt"><div class="wolbl"><span>' + esc(o) + '</span><span class="mono wonum">you ' + fp + '% · world ' + wp + '%</span></div>' +
        '<span class="strack"><span class="sfill fam" style="width:' + fp + '%"></span></span>' +
        '<span class="strack"><span class="sfill wor" style="width:' + wp + '%"></span></span></div>';
    });
  } else if(w.type === "free"){
    h += '<div class="wsents">';
    SENTS.forEach(function(sp){
      var n = (w.s && w.s[sp[0]]) || 0;
      h += '<div class="srow"><span class="slbl">' + sp[1] + '</span>' +
        '<span class="strack"><span class="sfill wor" style="width:' + n + '%"></span></span>' +
        '<span class="snum mono">' + n + '</span></div>';
    });
    h += '</div>';
    if(w.themes && w.themes.length){
      h += '<div class="wthemes">' + w.themes.map(function(t){
        return '<span class="wtag">' + esc(t[0]) + ' <span class="mono">' + t[1] + '</span></span>';
      }).join("") + '</div>';
    }
    var fam = familyWordSet(entries);
    var overlap = Object.keys(w.words || {}).filter(function(k){ return fam[k]; })
      .sort(function(a, b){ return w.words[b] - w.words[a]; }).slice(0, 2);
    if(overlap.length){
      h += '<div class="woverlap">Your table said <b>“' + overlap.map(esc).join('”</b> and <b>“') + '”</b> too — right along with the panel.</div>';
    }
    (w.quotes || []).forEach(function(qt){
      h += '<div class="wquote">“' + esc(qt.text) + '”<span class="wname">' + esc(qt.name) + ' · panel</span></div>';
    });
  }
  h += '<div class="wcap">A simulated panel — one hundred generated dinner guests, for perspective. Not real people.</div></div>';
  return h;
}

function renderPollReveal(q, entries){
  var counts = q.o.map(function(){ return []; });
  var notes = q.o.map(function(){ return []; });
  entries.forEach(function(e){
    if(counts[e.ans.choice]){
      counts[e.ans.choice].push(e.name);
      if(e.ans.note) notes[e.ans.choice].push({name:e.name, note:e.ans.note});
    }
  });
  var total = entries.length;
  var max = Math.max.apply(null, counts.map(function(c){return c.length;}));
  var h = '<div class="card">';
  q.o.forEach(function(o,i){
    var n = counts[i].length, pct = total? Math.round(n/total*100) : 0;
    h += '<div class="pollrow"><div class="pollhead"><span class="lbl">' + esc(o) +
      (n===max && n>0 ? '<span class="lead mono">★ LEADING</span>' : '') + '</span>' +
      '<span class="num mono">' + n + ' · ' + pct + '%</span></div>' +
      '<div class="bartrack"><div class="barfill" style="width:' + (total? (n/total*100) : 0) + '%"></div></div>' +
      '<div class="voters">' + (n ? counts[i].map(esc).join(" · ") : "—") + '</div>';
    if(notes[i].length){
      h += '<div class="pollnotes">' + notes[i].map(function(x){
        return '<span class="pn"><b>' + esc(x.name) + '</b> “' + esc(x.note) + '”</span>';
      }).join("") + '</div>';
    }
    entries.forEach(function(e){
      if(e.ans.choice === i && e.ans.media && e.ans.media.length){
        h += '<div class="pollmedia"><span class="pn"><b>' + esc(e.name) + '</b></span>' + renderMediaList(e.ans.media) + '</div>';
      }
    });
    h += '</div>';
  });
  h += '</div>';
  return h;
}

function renderLetters(dateKey, q, entries, me){
  var trends = computeTrends(entries.map(function(e){ return {name:e.name, text:e.ans.text||"", at:e.ans.at}; }));
  var h = "";
  if(entries.length>=2){
    h += '<div class="trends"><h3>Common threads</h3>';
    if(trends.shared.length){
      h += '<ul>' + trends.shared.map(function(s){
        return '<li><span class="w">“' + esc(s.word) + '”</span> came up for ' + esc(s.people.join(", ")) + '</li>';
      }).join("") + '</ul>';
    } else {
      h += '<div style="font-size:14.5px">' + entries.length + ' very different answers tonight — no two alike. Worth reading every one.</div>';
    }
    var bits = [];
    if(trends.first && trends.first.at) bits.push("First in: <b>" + esc(trends.first.name) + "</b>");
    if(trends.longest) bits.push("Longest letter: <b>" + esc(trends.longest.name) + "</b> (" + (trends.longest.text.trim().split(/\s+/).length) + " words)");
    if(bits.length) h += '<div class="foot">' + bits.join(" · ") + '</div>';
    h += '</div>';
  }
  h += '<div class="lettergroup">';
  entries.forEach(function(e){
    var when = (e.ans.at && e.ans.at > 1e12) ? new Date(e.ans.at).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}) : "";
    h += '<div class="letter" id="ans-' + e.id + '"><div class="from"><span class="who" style="--avh:' + hueFor(e.name) + '">' + avHTML(e.name) + esc(e.name) + '</span><span class="when mono">' + when + '</span></div>' +
      '<div class="txt">' + esc(e.ans.text) + '</div>' + renderMediaList(e.ans.media) + renderReacts(dateKey, e.id, me) + '</div>';
  });
  h += '</div>';
  return h;
}

var EMOJI = ["❤️","😂","🥹"];
function renderReacts(dateKey, targetId, me){
  var d = day(dateKey);
  var r = (d.reactions && d.reactions[targetId]) || {};
  var h = '<div class="reacts">' + EMOJI.map(function(em){
    var who = r[em] || [];
    var mine = !!me && who.indexOf(me.id)>=0;
    return '<button class="' + (mine?"mine":"") + '" data-act="react" data-day="' + dateKey + '" data-t="' + targetId + '" data-e="' + esc(em) + '" ' +
      'title="' + esc(who.map(function(id){ var m=memberById(id); return m?m.name:""; }).filter(Boolean).join(", ")) + '">' +
      em + (who.length? ' <span class="mono">' + who.length + '</span>' : "") + '</button>';
  }).join("");
  if(me && chatOn()) h += '<button class="ansrep" data-act="ansreply" data-day="' + dateKey + '" data-m="' + targetId + '">↩ reply</button>';
  h += '</div>';
  return h;
}

function renderArchive(){
  var today = famParts().dateKey;
  var cur = currentRoundKey();
  var keys = Object.keys(state.days).filter(function(k){
    return baseOf(k) < today || (baseOf(k) === today && k !== cur);
  }).sort(function(a, b){
    if(baseOf(a) !== baseOf(b)) return baseOf(a) < baseOf(b) ? 1 : -1;
    return roundOf(b) - roundOf(a);
  });
  var h = '<div style="margin-top:26px"><div class="sectionhead">Past days at the table</div>';
  if(!keys.length) h += '<p class="hint">Nothing here yet — after your first evening together, every day’s question and answers live on here.</p>';
  keys.forEach(function(k){
    var q = questionForDate(k);
    var n = Object.keys(day(k).answers).length;
    var rnd = roundOf(k);
    h += '<button class="dayrow" data-act="goto" data-v="day:' + k + '">' +
      '<span class="d mono">' + prettyDate(k,{month:"short",day:"numeric"}) + '<br>Day ' + dayNumber(k) + (rnd > 1 ? ' · №' + rnd : '') + '</span>' +
      '<span class="qq">' + esc(q.q) + '</span>' +

function tzSelect(id, val){
  var zones;
  try{ zones = Intl.supportedValuesOf("timeZone"); }
  catch(_e){ zones = ["America/Los_Angeles","America/New_York","America/Toronto","Europe/London","Europe/Paris","Asia/Manila","Asia/Shanghai","Asia/Tokyo","Australia/Sydney"]; }
  var cur = val || Intl.DateTimeFormat().resolvedOptions().timeZone;
  if(zones.indexOf(cur)<0) zones = [cur].concat(zones);
  return '<select id="' + id + '">' + zones.map(function(z){
    return '<option value="' + esc(z) + '"' + (z===cur?" selected":"") + '>' + esc(z.replace(/_/g," ")) + '</option>';
  }).join("") + '</select>';
}

document.addEventListener("input", function(ev){
  var t = ev.target;
  if(t && t.id === "freetext") draftText = t.value;
  if(t && t.id === "chatinput") chatDraft = t.value;
  if(t && t.id === "pollnote") draftNote = t.value;
});
document.addEventListener("change", function(ev){
  if(ev.target && ev.target.id === "mediafile"){
    var fs = ev.target.files || [];
    for(var i = 0; i < fs.length; i++) addPendingFile(fs[i]);
    ev.target.value = "";
  }
});
document.addEventListener("keydown", function(ev){
  if(ev.key === "Enter" && ev.target && ev.target.id === "chatinput"){
    ev.preventDefault();
    var btn = document.querySelector('[data-act="chatsend"]');
    if(btn) sendChat(btn.getAttribute("data-day"));
  }
});
document.addEventListener("click", function(ev){
  var el = ev.target.closest("[data-act]");
  if(!el) return;
  var act = el.getAttribute("data-act");

  if(act==="goto"){ view = el.getAttribute("data-v"); editingAnswer=false; draftText=""; draftChoice=null; draftNote=""; pendingMedia=[]; chatDraft=""; chatReplyTo=null; render(); }
  else if(act==="gotofamily"){ view="family"; render(); }
  else if(act==="pickme"){ setMe(el.getAttribute("data-id")); }
  else if(act==="switchme"){
    if(sampleMode){ sampleMe=null; render(); return; }
    forgetMe();
    view = "today";
    render();
  }
  else if(act==="pickopt"){ draftChoice = +el.getAttribute("data-i"); render(); }
  else if(act==="reroll"){
    var rk = currentRoundKey();
    var rd = ensureDay(rk);
    if(Object.keys(rd.answers).length){ toast("Someone already answered — today's question is set"); render(); return; }
    var used = {};
    Object.keys(state.days).forEach(function(k){ var dq = state.days[k].q; if(dq && dq.qi != null) used[dq.qi] = true; });
    var curQi = worldQi(rd.q);
    if(curQi >= 0) used[curQi] = true;
    var fresh = QBANK.filter(function(qq){ return !used[qq.qi]; });
    if(!fresh.length) fresh = QBANK.filter(function(qq){ return qq.qi !== curQi; });
    rd.q = fresh[Math.floor(Math.random() * fresh.length)];
    draftText = ""; draftChoice = null; worldCache = {};
    save();
  }
  else if(act==="editans"){ editingAnswer = true; draftChoice=null; draftText=""; draftNote=""; pendingMedia=[]; render(); }
  else if(act==="canceledit"){ editingAnswer = false; draftChoice=null; draftText=""; draftNote=""; pendingMedia=[]; render(); }
  else if(act==="submit"){
    var me = getMe(); if(!me) return;
    if(recState){ toast("Finish the voice memo first"); return; }
    var dateKey = currentRoundKey();
    var d = ensureDay(dateKey);
    var q = d.q;
    var ans = null;
    if(q.t==="poll"){
      var prev = d.answers[me.id];
      var sel = draftChoice!=null ? draftChoice : (prev ? prev.choice : null);
      if(sel==null) return;
      var noteEl = document.getElementById("pollnote");
      var note = (noteEl ? noteEl.value : draftNote).trim().slice(0, 200);
      ans = {choice:sel, at:Date.now()};
      if(note) ans.note = note;
    } else {
      var ta = document.getElementById("freetext");
      var txt = (ta ? ta.value : draftText).trim();
      if(!txt && !pendingMedia.length){ toast("Write a little something first — or attach it"); return; }
      ans = {text:txt, at:Date.now()};
    }
    var prevMedia = d.answers[me.id] && d.answers[me.id].media;
    el.disabled = true;
    if(pendingMedia.length) el.textContent = "Sending…";
    uploadPending().then(function(refs){
      var media = (prevMedia || []).concat(refs);
      if(media.length) ans.media = media;
      d.answers[me.id] = ans;
      editingAnswer=false; draftText=""; draftChoice=null; draftNote=""; pendingMedia=[];
      save();
    }, function(){
      el.disabled = false;
      el.textContent = q.t==="poll" ? "Lock it in" : "Send to the table";
      toast("Couldn't upload the attachment — try again");
    });
  }
  else if(act==="react"){
    var me2 = getMe(); if(!me2 || readOnly) return;
    var d2 = ensureDay(el.getAttribute("data-day"));
    var tId = el.getAttribute("data-t"), em = el.getAttribute("data-e");
    var slot = d2.reactions[tId] = d2.reactions[tId] || {};
    var arr = slot[em] = slot[em] || [];
    var ix = arr.indexOf(me2.id);
    if(ix>=0) arr.splice(ix,1); else arr.push(me2.id);
    if(!arr.length) delete slot[em];
    save();
  }
  else if(act==="savefam"){
    var nm = document.getElementById("famname"), tz = document.getElementById("famtz");
    if(nm && nm.value.trim()) state.familyName = nm.value.trim();
    if(tz) state.tz = tz.value;
    toast("Saved"); save();
  }
  else if(act==="addmember"){
    var inp = document.getElementById("newmember");
    var name = inp ? inp.value.trim() : "";
    if(!name) return;
    state.members.push({id:uid(), name:name});
    save();
  }
  /* setup actions */
  else if(act==="su-start"){
    var nameEl = document.getElementById("su-name"), tzEl = document.getElementById("su-tz"), namesEl = document.getElementById("su-names");
    var famName = nameEl ? nameEl.value.trim() : "";
    if(!famName){ toast("Give the family a name"); return; }
    var names = (namesEl ? namesEl.value : "").split("\n").map(function(s){return s.trim();}).filter(Boolean);
    if(!names.length){ toast("Add at least one person"); return; }
    state.familyName = famName;
    state.tz = tzEl ? tzEl.value : null;
    state.members = names.map(function(n){ return {id:uid(), name:n}; });
    state.setup = true;
    state.createdAt = famParts().dateKey;
    state.days[state.createdAt] = {q:QBANK[STARTER_QI], answers:{}, reactions:{}};
    save();
  }
  else if(act==="loadsample"){
    sampleMode = true; sampleMe = null; chatCache = {};
    state = loadSample();
    view = "today"; render();
  }
  else if(act==="exitsample"){
    sampleMode = false; sampleMe = null; chatCache = {};
    state = JSON.parse(REAL_STATE_JSON);
    view = "today";
    if(IS_ARTIFACT) render(); else bootRoom();
  }
  /* web rooms actions */
  else if(act==="rm-create"){
    var rn = document.getElementById("rm-name"), rt = document.getElementById("rm-tz"), ry = document.getElementById("rm-you");
    var famName2 = rn ? rn.value.trim() : "";
    var you = ry ? ry.value.trim() : "";
    if(!famName2){ toast("Give the family a name"); return; }
    if(!you){ toast("Add your name"); return; }
    var creator = {id:uid(), name:you};
    var tzVal = rt ? rt.value : null;
    var room = {v:2, setup:true, familyName:famName2, tz:tzVal, revealHour:18,
      createdAt: famParts(tzVal).dateKey, members:[creator], days:{}};
    room.days[room.createdAt] = {q:QBANK[STARTER_QI], answers:{}, reactions:{}};
    el.disabled = true; el.textContent = "Setting the table…";
    freshRoomId(3).then(function(newId){
      return apiSave(newId, room).then(function(){
        state = room; roomId = newId; roomError = null; roomLoading = false;
        rememberRoom(newId, creator.id, famName2);
        location.hash = "r=" + newId;
        view = "family"; /* land on the invite link so they can share it right away */
        render(); startSync();
        toast("Room created — share the invite link");
      });
    }).catch(function(){
      el.disabled = false; el.textContent = "Create the room";
      toast("Couldn't create the room — check your connection");
    });
  }
  else if(act==="rm-join"){
    var ji = document.getElementById("join-name");
    var jn = ji ? ji.value.trim() : "";
    if(!jn){ toast("Add your name"); return; }
    var joiner = {id:uid(), name:jn};
    state.members.push(joiner);
    rememberRoom(roomId, joiner.id, state.familyName);
    save();
  }
  else if(act==="newround"){
    var curKey = currentRoundKey();
    if(!state.days[curKey] || !familyAnswered(curKey)){ toast("A new question opens once everyone has answered"); render(); return; }
    var usedQ = {};
    Object.keys(state.days).forEach(function(k){ var dq = state.days[k].q; if(dq && dq.qi != null) usedQ[dq.qi] = true; });
    var freshQ = QBANK.filter(function(qq){ return !usedQ[qq.qi]; });
    if(!freshQ.length){ toast("You've been through all 60 questions — impressive"); return; }
    var nextKey = baseOf(curKey) + "#" + (roundOf(curKey) + 1);
    state.days[nextKey] = {q: freshQ[Math.floor(Math.random() * freshQ.length)], answers:{}, reactions:{}};
    draftText = ""; draftChoice = null; editingAnswer = false;
    save();
  }
  else if(act==="recstart"){ startRec(); }
  else if(act==="recstop"){ stopRec(); }
  else if(act==="unattach"){ pendingMedia.splice(+el.getAttribute("data-i"), 1); render(); }
  else if(act==="loadmedia"){
    el.disabled = true; el.textContent = "loading…";
    loadMedia(el.getAttribute("data-mid"));
  }
  else if(act==="chatsend"){ sendChat(el.getAttribute("data-day")); }
  else if(act==="chatreact"){ toggleChatReact(el.getAttribute("data-day"), el.getAttribute("data-msg"), el.getAttribute("data-e")); }
  else if(act==="chatreplyto"){
    chatReplyTo = el.getAttribute("data-msg");
    updateReplyBar(el.getAttribute("data-day"));
    var ciEl = document.getElementById("chatinput");
    if(ciEl) ciEl.focus();
  }
  else if(act==="chatreplycancel"){
    chatReplyTo = null;
    var bar = document.getElementById("replybar");
    if(bar) bar.innerHTML = "";
  }
  else if(act==="ansreply"){
    chatReplyTo = "a:" + el.getAttribute("data-m");
    updateReplyBar(el.getAttribute("data-day"));
    var ciAns = document.getElementById("chatinput");
    if(ciAns){ ciAns.scrollIntoView({block:"center", behavior:"smooth"}); ciAns.focus(); }
  }
  else if(act==="chatjump"){
    var jref = el.getAttribute("data-msg");
    var target = document.getElementById(jref.indexOf("a:") === 0 ? "ans-" + jref.slice(2) : "msg-" + jref);
    if(target){
      target.scrollIntoView({block:"center", behavior:"smooth"});
      target.classList.add("flash");
      setTimeout(function(){ target.classList.remove("flash"); }, 1400);
    }
  }
  else if(act==="rm-retry"){ bootRoom(); }
  else if(act==="copylink"){
    var link = inviteLink();
    var copied = function(){ toast("Invite link copied"); };
    var manual = function(){
      var box = document.getElementById("invitelink");
      if(box){ box.focus(); box.select(); }
      try{ document.execCommand("copy"); copied(); }catch(_e){ toast("Copy the link from the box"); }
    };
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(copied, manual);
    else manual();
  }
});

/* countdown tick — light update; full re-render only when the lock opens */
setInterval(function(){
  if(!state.setup) return;
  var active = document.activeElement;
  var typing = active && (active.tagName==="TEXTAREA" || active.tagName==="INPUT");
  var cdEl = document.querySelector("[data-countdown]");
  if(cdEl){
    if(isUnlocked(currentRoundKey())){ if(!typing) render(); return; }
    var mins = minutesToReveal();
    cdEl.textContent = mins>=60 ? Math.floor(mins/60) + "h " + (mins%60) + "m" : mins + "m";
  }
}, 30000);

if(IS_ARTIFACT) render(); else bootRoom();
})();
</script>
